services:
  # ==========================================
  # SQL SERVER SERVICE
  # ==========================================
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: property-management-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "YourStrongPassword123!"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    networks:
      - property-management-network
    restart: unless-stopped
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "YourStrongPassword123!" -C -Q "SELECT 1" || exit 1
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ==========================================
  # REDIS SERVICE
  # ==========================================
  redis:
    image: redis:7-alpine
    container_name: property-management-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - property-management-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # ==========================================
  # API SERVICE
  # ==========================================
  api:
    build:
      context: .
      dockerfile: WebAPI/Dockerfile
    container_name: property-management-api
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=sqlserver,1433;Database=PropertyManagementDb;User Id=sa;Password=YourStrongPassword123!;TrustServerCertificate=True;MultipleActiveResultSets=true;
      - ConnectionStrings__RedisConnection=redis:6379,password=,defaultDatabase=0
    ports:
      - "5000:8080"
      - "5001:8081"
    depends_on:
      sqlserver:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./logs:/app/logs
    networks:
      - property-management-network
    restart: unless-stopped

# ==========================================
# VOLUMES
# ==========================================
volumes:
  sqlserver_data:
  redis_data:

# ==========================================
# NETWORKS
# ==========================================
networks:
  property-management-network:
    driver: bridge